# WhatsApp do escritório (Evolution API) no servidor gratuito da Oracle (ARM).
# Versão fixada: atualize só depois de ler as notas da versão nova.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    env_file: .env
    depends_on: [postgres, redis]
    volumes:
      - instancias:/evolution/instances
    networks: [interna]

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - banco:/var/lib/postgresql/data
    networks: [interna]

  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - cache:/data
    networks: [interna]

  # Recebe a internet nas portas 80/443 e tira o certificado HTTPS sozinho.
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
    networks: [interna]

volumes:
  instancias:
  banco:
  cache:
  caddy_dados:

networks:
  interna:
